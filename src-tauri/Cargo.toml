[package]
name = "eternal-launcher"
version = "0.1.0"
description = "Launcher de bureau des jeux EternalTwin"
authors = ["EternalTwin"]
license = "AGPL-3.0-only"
repository = "https://github.com/eternaltwin/EternalLauncher"
edition = "2024"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "eternal_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset", "system-proxy"] }
thiserror = "2.0.21"
semver = "1.0.28"
base64 = "0.23.1"
include_dir = "0.7.4"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
